name: Content freshness review

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Clone this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate content review queue
        run: |
          npm run content:review -- \
            --output .reports/content-review.md \
            --json .reports/content-review.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Generate content relationship graph
        run: |
          npm run content:graph -- \
            --output .reports/content-graph.md \
            --json .reports/content-graph.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Generate content trust ledger
        run: |
          npm run content:health -- \
            --output .reports/content-health.md \
            --json .reports/content-health.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload content review reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-review-queue
          path: |
            .reports/content-review.*
            .reports/content-graph.*
            .reports/content-health.*
          if-no-files-found: warn
          retention-days: 30
