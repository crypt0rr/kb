name: Build website using Astro

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check local environment
        run: npm run doctor

      - name: Run unit tests
        run: npm test

      - name: Check Astro project
        run: npm run check

      - name: Check content
        run: npm run check:content

      - name: Check links
        run: npm run check:links

      - name: Build Astro site
        run: npm run build

      - name: Check deployable asset sizes
        run: npm run check:assets

      - name: Smoke test build output
        run: npm run smoke

      - name: Audit dependencies
        run: npm run audit:known

      - name: Check outdated dependencies
        run: npm run check:outdated
