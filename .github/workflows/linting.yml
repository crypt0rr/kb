name: Perform markdown linting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'content/**/*.md'
      - 'README.md'
      - '.markdownlint.yml'
      - '.github/workflows/linting.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'content/**/*.md'
      - 'README.md'
      - '.markdownlint.yml'
      - '.github/workflows/linting.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Clone this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint content Markdown
        uses: rvben/rumdl@a7a8434abe60f64239ea05624885f9bad66a1026 # v0.2.79
        with:
          version: '0.2.79'
          path: 'content/'
          config: '.markdownlint.yml'
          report-type: annotations

      - name: Lint README
        uses: rvben/rumdl@a7a8434abe60f64239ea05624885f9bad66a1026 # v0.2.79
        with:
          version: '0.2.79'
          path: 'README.md'
          config: '.markdownlint.yml'
          report-type: annotations
