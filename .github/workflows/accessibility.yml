name: Browser accessibility smoke tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/accessibility.yml"
      - ".node-version"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "public/_headers"
      - "src/**"
      - "static/**"
      - "content/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/accessibility.yml"
      - ".node-version"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "public/_headers"
      - "src/**"
      - "static/**"
      - "content/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Clone this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser accessibility smoke tests
        run: npm run test:a11y

      - name: Add job summary
        if: always()
        run: |
          {
            echo "## Browser accessibility smoke tests"
            echo
            echo "Checked representative routes plus keyboard search and mobile navigation with Playwright and Axe, served with the production _headers (CSP and cross-origin policies)."
            echo
            echo "Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
